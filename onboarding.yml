# Onboarding del trío de pj-template: lo propio del proyecto que reciben PM, WK y RV en su ficha.
# Lo escribe `./pj onboard` (entrevista); se puede editar a mano y correr `./pj`.
# hecho vacío = onboarding sin hacer. Esquema: schema/onboarding.schema.json de pj-template.
version: 1
hecho: "2026-11-16"
mision: "Molde único de los tríos PM/WK/RV de Roberto para Cursor y agy: reglas, plantillas, scripts y workflows que les llegan a los hijos de family.yml por template_ref y PR de sync."
no_tocar:
  - "los archivos generados (`.agents/agents/`, `.cursor/`): se cambian en `plantillas/` y se regeneran con `make generar`"
  - "las skills de `.agents/skills/`: se cambian en `robert-flo/skills` (rama `personal`) y llegan por sync"
  - "los hijos de `family.yml` a mano: todo les llega por PR de sync"
reglas_proyecto:
  - "toda regla nueva o cambiada lleva su ADR en `docs/adr/` (número siguiente)"
  - "un hijo versiona solo sus archivos a mano (`proyecto.yml`, `onboarding.yml`, `AGENTS.md`, `README.md`, `.gitignore`, `./pj`, el workflow y sus extras)"
primeros_pasos:
  - "leer `AGENTS.md`, `docs/pj-template.md` y el ADR más nuevo de `docs/adr/`"
  - "revisar los issues abiertos (`gh issue list`) y proponerte por cuál empezar"
wk:
  como_probar:
    - "`make check` da «todo bien» (incluye el hijo de prueba y `scripts/prueba-onboarding.sh`)"
    - "con agy instalado y logueado, `make humo`: el PM abre con su primer mensaje"
rv:
  exige:
    - "`make check` en verde, corrido por vos en un worktree del PR"
    - "`shellcheck` limpio en los scripts que se toquen"
    - "ADR nuevo si cambia una regla, y README/AGENTS.md al día"
