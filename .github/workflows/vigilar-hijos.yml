# Solo en pj-template (no está en template-paths.txt, así que no llega a los hijos).
# Todos los días, a mano y cuando cambia family.yml en main, compara los hijos de pj-template (creados con «Use this template» o en
# modo dependencia, con template_ref en proyecto.yml) con family.yml, revisa que cada hijo tenga el
# secreto PJ_TEMPLATE_TOKEN y corre scripts/deriva.sh: regenera cada hijo con el template actual y
# muestra el % de archivos idénticos en el resumen del run. Si falta algo o hay deriva, abre o
# actualiza un único issue "hijos sin registrar o sin secret"; cuando todo está bien, lo cierra.
# Los de family.yml que no salieron del template se informan como "pendientes de migrar" sin fallar.
name: vigilar-hijos
on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [family.yml]
permissions:
  contents: read
  issues: write
jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comparar hijos
        env:
          GH_TOKEN: ${{ secrets.PJ_TEMPLATE_TOKEN }}
          ISSUES_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PY="$(bash scripts/py.sh)"; export PY
          titulo="hijos sin registrar o sin secret"
          familia=$("$PY" -c 'import yaml;print("\n".join(sorted(yaml.safe_load(open("family.yml"))["hijos"])))')
          desde_template=$(gh api --paginate "user/repos?per_page=100&affiliation=owner" --jq '.[] | select(.owner.login=="robert-flo") | .full_name')
          creados=""
          for r in $desde_template; do
            [ "$r" = robert-flo/pj-template ] && continue
            t=$(gh api "repos/$r" --jq '.template_repository.full_name // ""')
            if [ "$t" = robert-flo/pj-template ] || { [[ "$r" == robert-flo/pj-* ]] && gh api "repos/$r/contents/proyecto.yml" --jq .content 2>/dev/null | base64 -d 2>/dev/null | grep -q '^template_ref:'; }; then
              creados+="$r"$'\n'
            fi
          done
          creados=$(printf '%s' "$creados" | sort -u)
          problemas=""; pendientes=""; oks=""
          for r in $creados; do
            grep -qx "$r" <<<"$familia" || problemas+="- [ ] \`$r\` salió del template pero no está en family.yml"$'\n'
          done
          for r in $familia; do
            if ! grep -qx "$r" <<<"$creados"; then pendientes+="- \`$r\` está en family.yml pero no salió del template (pendiente de migrar)"$'\n'; continue; fi
            if gh secret list -R "$r" --json name --jq '.[].name' | grep -qx PJ_TEMPLATE_TOKEN; then oks+="- \`$r\` ok"$'\n'
            else problemas+="- [ ] \`$r\` no tiene el secreto PJ_TEMPLATE_TOKEN"$'\n'; fi
          done
          DERIVA_MD="$RUNNER_TEMP/deriva.md" bash scripts/deriva.sh > /dev/null
          deriva_n=$(grep -oE 'Hijos con deriva: [0-9]+' "$RUNNER_TEMP/deriva.md" | grep -oE '[0-9]+')
          { echo "## Hijos de pj-template"; echo; echo "### Ok"; echo "${oks:-ninguno}"; echo "### Problemas"; echo "${problemas:-ninguno}"; echo "### Pendientes de migrar"; echo "${pendientes:-ninguno}"; echo; cat "$RUNNER_TEMP/deriva.md"; } | tee -a "$GITHUB_STEP_SUMMARY"
          export GH_TOKEN="$ISSUES_TOKEN"
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$titulo\" in:title" --json number,title --jq ".[] | select(.title==\"$titulo\") | .number" | head -1)
          if [ -n "$problemas" ] || [ "${deriva_n:-0}" -gt 0 ]; then
            cuerpo=$(printf 'Detectado por vigilar-hijos (%s).\n\n### Problemas\n%s\n### Pendientes de migrar (informativo)\n%s\nArreglo: `make nuevo-hijo P=<nombre>` o sumá el hijo a family.yml por PR y cargá el secreto. La deriva se arregla mergeando el PR de sync del hijo.\n\n%s\n' "$(date -u +%F)" "${problemas:-ninguno}" "${pendientes:-ninguno}" "$(cat "$RUNNER_TEMP/deriva.md")")
            if [ -n "$n" ]; then gh issue edit "$n" -R "$GITHUB_REPOSITORY" --body "$cuerpo"
            else gh issue create -R "$GITHUB_REPOSITORY" --title "$titulo" --body "$cuerpo"; fi
          elif [ -n "$n" ]; then
            gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "Todos los hijos registrados, con secreto y sin deriva."
          fi
