# Workflow reutilizable de robert-flo/pj-template. Lo llama pj-template.yml (en el molde y en cada hijo).
# - Hijo en modo dependencia: sube `template_ref` de proyecto.yml al último main de pj-template
#   (y actualiza ./pj y el caller) por PR. El PR corre `./pj check`.
# - pj-template: sincroniza skills desde robert-flo/skills@personal por PR.
# - Hijo viejo (copia): trae template-paths.txt, skills y regenera, por PR.
# Secreto requerido en el repo que llama: PJ_TEMPLATE_TOKEN (ver docs/pj-template.md).
name: pj-sync (reutilizable)
on:
  workflow_call:
    inputs:
      template_ref:
        type: string
        default: main
      skills_ref:
        type: string
        default: personal
    secrets:
      PJ_TEMPLATE_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PJ_TEMPLATE_TOKEN }}
          fetch-depth: 0
      - name: Checkout pj-template
        if: github.repository != 'robert-flo/pj-template'
        uses: actions/checkout@v4
        with:
          repository: robert-flo/pj-template
          ref: ${{ inputs.template_ref }}
          token: ${{ secrets.PJ_TEMPLATE_TOKEN }}
          path: .pj-sync/tpl
      - name: Checkout robert-flo/skills
        uses: actions/checkout@v4
        with:
          repository: robert-flo/skills
          ref: ${{ inputs.skills_ref }}
          path: .pj-sync/skills
      - name: Sincronizar
        env:
          PJ_TEMPLATE_TOKEN: ${{ secrets.PJ_TEMPLATE_TOKEN }}
        run: |
          tpl=.pj-sync/tpl; [ -d "$tpl" ] || tpl=.
          bash "$tpl/scripts/ci-sync.sh" "$tpl" .pj-sync/skills
          rm -rf .pj-sync
      - name: Abrir PR si hay cambios
        env:
          GH_TOKEN: ${{ secrets.PJ_TEMPLATE_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Sin cambios."; exit 0; fi
          base="$(git rev-parse --abbrev-ref HEAD)"
          rama="pj-template/sync-${GITHUB_RUN_ID}"
          git config user.name "Roberto Flores"
          git config user.email "25asab015@ujmd.edu.sv"
          git switch -c "$rama"
          git add -A
          git commit -q -m "$MENSAJE" -m "Generado por pj-sync; no se edita a mano." \
            -m "agente: ci · plataforma: GitHub Actions"
          git push -q origin "$rama"
          body="$(mktemp)"
          {
            echo "## Summary"
            echo "$MENSAJE"
            echo; echo '```'; git show --stat --format= HEAD | tail -n 40; echo '```'
            echo; echo "## Evidence"; echo "El check pasó en el run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            echo; echo "## Merge Danger"; echo "Door: de dos vías (revertible). Blast radius: reglas, skills y fichas del trío de este repo."
          } > "$body"
          url="$(gh pr create --base "$base" --head "$rama" --title "$TITULO" --body-file "$body")"
          echo "PR: $url"
          gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName|startswith("pj-template/sync-")) | select(.headRefName != "'"$rama"'") | .number' |
            while read -r n; do gh pr close "$n" --delete-branch --comment "Reemplazado por $url"; done
