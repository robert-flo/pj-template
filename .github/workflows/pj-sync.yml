# Workflow reutilizable de robert-flo/pj-template. Lo llama pj-template.yml (en el molde y en cada hijo).
# - Hijo en modo dependencia: sube `template_ref` de proyecto.yml al último main de pj-template
#   (y actualiza ./pj y el caller) por PR. El PR corre `./pj check`.
# - pj-template: sincroniza skills desde robert-flo/skills@personal por PR.
# - Hijo viejo (copia): trae template-paths.txt, skills y regenera, por PR.
# Secreto requerido en el repo que llama: PJ_TEMPLATE_TOKEN (ver docs/pj-template.md).
name: pj-sync (reutilizable)
on:
  workflow_call:
    inputs:
      template_ref:
        type: string
        default: main
      skills_ref:
        type: string
        default: personal
    secrets:
      PJ_TEMPLATE_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PJ_TEMPLATE_TOKEN }}
          fetch-depth: 0
      - name: Checkout pj-template
        if: github.repository != 'robert-flo/pj-template'
        uses: actions/checkout@v4
        with:
          repository: robert-flo/pj-template
          ref: ${{ inputs.template_ref }}
          token: ${{ secrets.PJ_TEMPLATE_TOKEN }}
          path: .pj-sync/tpl
      - name: Checkout robert-flo/skills
        uses: actions/checkout@v4
        with:
          repository: robert-flo/skills
          ref: ${{ inputs.skills_ref }}
          path: .pj-sync/skills
      - name: Sincronizar
        env:
          PJ_TEMPLATE_TOKEN: ${{ secrets.PJ_TEMPLATE_TOKEN }}
        run: |
          tpl=.pj-sync/tpl; [ -d "$tpl" ] || tpl=.
          bash "$tpl/scripts/ci-sync.sh" "$tpl" .pj-sync/skills
          cp "$tpl/scripts/ci-pr.sh" "$RUNNER_TEMP/ci-pr.sh"
          rm -rf .pj-sync
      - name: Abrir PR si hay cambios
        env:
          GH_TOKEN: ${{ secrets.PJ_TEMPLATE_TOKEN }}
        run: bash "$RUNNER_TEMP/ci-pr.sh"
