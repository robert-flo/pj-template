# Workflow reutilizable de robert-flo/pj-template.
# Trae reglas/plantillas/scripts de pj-template, sincroniza las skills desde robert-flo/skills@personal,
# regenera fichas y adaptadores, y abre un PR en el repo que lo llama si algo cambió.
# Secreto requerido en el repo que llama: PJ_TEMPLATE_TOKEN (PAT fine-grained de robert-flo con
# Contents: read/write y Pull requests: read/write sobre el repo que llama, y Contents: read sobre
# robert-flo/pj-template, que es privado).
name: pj-sync (reutilizable)
on:
  workflow_call:
    inputs:
      template_ref:
        type: string
        default: main
      skills_ref:
        type: string
        default: personal
    secrets:
      PJ_TEMPLATE_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PJ_TEMPLATE_TOKEN }}
          fetch-depth: 0
      - name: Checkout pj-template
        if: github.repository != 'robert-flo/pj-template'
        uses: actions/checkout@v4
        with:
          repository: robert-flo/pj-template
          ref: ${{ inputs.template_ref }}
          token: ${{ secrets.PJ_TEMPLATE_TOKEN }}
          path: .pj-sync/tpl
      - name: Checkout robert-flo/skills
        uses: actions/checkout@v4
        with:
          repository: robert-flo/skills
          ref: ${{ inputs.skills_ref }}
          path: .pj-sync/skills
      - name: Dependencias
        run: python3 -c 'import yaml' || pip install pyyaml
      - name: Traer lo del template
        if: github.repository != 'robert-flo/pj-template'
        run: bash .pj-sync/tpl/scripts/sync-template.sh .pj-sync/tpl
      - name: Sincronizar skills y regenerar
        run: |
          bash scripts/sync-skills.sh .pj-sync/skills
          echo "SKILLS_SHA=$(git -C .pj-sync/skills rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "TPL_SHA=$(git -C .pj-sync/tpl rev-parse --short HEAD 2>/dev/null || git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          rm -rf .pj-sync
          python3 scripts/generar.py
      - name: Check
        run: bash scripts/check.sh
      - name: Abrir PR si hay cambios
        env:
          GH_TOKEN: ${{ secrets.PJ_TEMPLATE_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Sin cambios."; exit 0; fi
          base="$(git rev-parse --abbrev-ref HEAD)"
          rama="pj-template/sync-${GITHUB_RUN_ID}"
          git config user.name "Roberto Flores"
          git config user.email "25asab015@ujmd.edu.sv"
          git switch -c "$rama"
          git add -A
          git commit -q -m "chore(pj-template): sync de reglas, plantillas y skills" \
            -m "pj-template@${TPL_SHA} · robert-flo/skills@${SKILLS_SHA}. Generado por pj-sync; no se edita a mano." \
            -m "agente: ci · plataforma: GitHub Actions"
          git push -q origin "$rama"
          {
            echo "## Summary"
            echo "Sync automático desde \`robert-flo/pj-template@${TPL_SHA}\` y \`robert-flo/skills@${SKILLS_SHA}\`."
            echo; echo '```'; git show --stat --format= HEAD | tail -n 40; echo '```'
            echo; echo "## Evidence"; echo "\`scripts/check.sh\` pasó en el run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            echo; echo "## Merge Danger"; echo "Door: de dos vías (revertible). Blast radius: reglas, skills y fichas del trío de este repo."
          } > /tmp/body.md
          url="$(gh pr create --base "$base" --head "$rama" --title "pj-template: sync de reglas y skills" --body-file /tmp/body.md)"
          echo "PR: $url"
          gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName|startswith("pj-template/sync-")) | select(.headRefName != "'"$rama"'") | .number' |
            while read -r n; do gh pr close "$n" --delete-branch --comment "Reemplazado por $url"; done
